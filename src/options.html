<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Select Translate settings</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="options">
    <header class="topbar">
      <img src="../icons/icon32.png" alt="" />
      <div>
        <p class="eyebrow" data-i18n="extName">Select Translate</p>
        <h1 data-i18n="optionsHeading">Settings</h1>
      </div>
    </header>
    <main>
      <section class="card">
        <h2 data-i18n="appearance">外觀</h2>
        <p class="section-desc" data-i18n="appearanceDesc">設定頁、工具列彈窗和翻譯氣泡都會跟著這些設定。</p>
        <label class="setting stack">
          <span>
            <span class="setting-title" data-i18n="uiLanguage">介面語言</span>
            <span class="setting-desc" data-i18n="uiLanguageDesc">設定頁、彈窗和氣泡的文字。</span>
          </span>
          <select id="uiLocale" name="uiLocale">
            <option value="en">English</option>
            <option value="zh-TW">繁體中文</option>
          </select>
        </label>
        <div class="setting">
          <div>
            <div class="setting-title" data-i18n="theme">主題</div>
            <div class="setting-desc" data-i18n="themeDesc">淺色、深色，跟隨系統，或跟隨 Chrome 目前的主題顏色。</div>
          </div>
          <div class="segmented" role="radiogroup" aria-label="theme">
            <button type="button" class="seg" data-appearance="light" data-i18n="themeLight">淺色</button>
            <button type="button" class="seg" data-appearance="dark" data-i18n="themeDark">深色</button>
            <button type="button" class="seg" data-appearance="system" data-i18n="themeSystem">系統</button>
            <button type="button" class="seg" data-appearance="chrome" data-i18n="themeChrome">Chrome</button>
          </div>
        </div>
        <div class="setting" id="accentSetting">
          <div>
            <div class="setting-title" data-i18n="accent">強調色</div>
            <div class="setting-desc" data-i18n="accentDesc">按鈕、選取狀態和氣泡重點會使用這個顏色。</div>
          </div>
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="preview" aria-hidden="true">
          <div class="preview-bubble">
            <div class="preview-toolbar">
              <span>English</span>
              <span>⇄</span>
              <span>中文（繁體）</span>
            </div>
            <div class="preview-source">engineering</div>
            <div class="preview-target">工程</div>
          </div>
        </div>
      </section>
      <section class="card">
        <h2 data-i18n="translation">Translation</h2>
        <label class="setting stack">
          <span>
            <span class="setting-title" data-i18n="provider">Translator</span>
            <span class="setting-desc" data-i18n="providerDesc">Use Google Translate by default, or your own OpenAI, Claude, or Gemini-compatible endpoint.</span>
          </span>
          <select id="translator" name="translator">
            <option value="google">Google Translate</option>
            <option value="llm">Custom LLM</option>
          </select>
        </label>
        <div id="llmSettings">
          <label class="setting stack">
            <span>
              <span class="setting-title" data-i18n="llmProvider">API format</span>
              <span class="setting-desc" data-i18n="llmProviderDesc">Choose the protocol your node speaks. Most proxies use OpenAI.</span>
            </span>
            <select id="llmProvider" name="llmProvider">
              <option value="openai">OpenAI</option>
              <option value="claude">Claude</option>
              <option value="gemini">Gemini</option>
            </select>
          </label>
          <label class="setting stack">
            <span>
              <span class="setting-title" data-i18n="llmEndpoint">API endpoint</span>
              <span class="setting-desc" data-i18n="llmEndpointDesc">Full request URL. Leave blank to use the official default for this format.</span>
            </span>
            <input id="llmEndpoint" name="llmEndpoint" type="url" spellcheck="false" />
          </label>
          <label class="setting stack">
            <span>
              <span class="setting-title" data-i18n="llmModel">Model</span>
              <span class="setting-desc" data-i18n="llmModelDesc">Model name on the node.</span>
            </span>
            <input id="llmModel" name="llmModel" type="text" spellcheck="false" />
          </label>
          <label class="setting stack">
            <span>
              <span class="setting-title" data-i18n="llmApiKey">API key</span>
              <span class="setting-desc" data-i18n="llmApiKeyDesc">Stored on this computer only. It is not synced with your Chrome account.</span>
            </span>
            <input id="llmApiKey" name="llmApiKey" type="password" autocomplete="off" spellcheck="false" />
          </label>
        </div>
        <label class="setting stack">
          <span>
            <span class="setting-title" data-i18n="targetLang">目標語言</span>
            <span class="setting-desc" data-i18n="targetLangDesc">選取文字後預設翻成這個語言。</span>
          </span>
          <select id="targetLang" name="targetLang"></select>
        </label>
        <label class="setting stack">
          <span>
            <span class="setting-title" data-i18n="sourceLang">來源語言</span>
            <span class="setting-desc" data-i18n="sourceLangDesc">通常保持自動偵測即可。</span>
          </span>
          <select id="sourceLang" name="sourceLang"></select>
        </label>
        <label class="setting stack">
          <span>
            <span class="setting-title" data-i18n="trigger">觸發方式</span>
            <span class="setting-desc" data-i18n="triggerDesc">選取後直接翻譯，或先顯示翻譯按鈕。</span>
          </span>
          <select id="trigger" name="trigger">
            <option value="auto">選取後直接顯示譯文</option>
            <option value="button">選取後顯示翻譯按鈕</option>
          </select>
        </label>
        <label class="setting">
          <span>
            <span class="setting-title" data-i18n="skipInputs">略過輸入框</span>
            <span class="setting-desc" data-i18n="skipInputsDesc">在搜尋欄、表單或文字框裡反白時不跳出翻譯。</span>
          </span>
          <input id="skipInputs" name="skipInputs" type="checkbox" class="switch" />
        </label>
        <label class="setting">
          <span>
            <span class="setting-title" data-i18n="enableTts">啟用朗讀</span>
            <span class="setting-desc" data-i18n="enableTtsDesc">在氣泡裡點喇叭，用 Google 翻譯的語音朗讀。</span>
          </span>
          <input id="enableTts" name="enableTts" type="checkbox" class="switch" />
        </label>
        <label class="setting stack">
          <span>
            <span class="setting-title" data-i18n="maxChars">單次最多字數</span>
            <span class="setting-desc" data-i18n="maxCharsDesc">超過這個長度會截斷後再翻譯。</span>
          </span>
          <input id="maxChars" name="maxChars" type="number" min="100" max="5000" step="100" />
        </label>
      </section>
      <section class="card">
        <h2 data-i18n="howto">使用方式</h2>
        <ol class="howto">
          <li data-i18n="howto1">在網頁反白文字，翻譯氣泡會自動出現。</li>
          <li data-i18n="howto2">可在氣泡裡改來源／目標語言，或點喇叭朗讀。</li>
          <li data-i18n="howto3">也可以反白後按滑鼠右鍵，或用 Alt+T。</li>
          <li data-i18n="howto4">工具列圖示可直接貼上文字翻譯。</li>
        </ol>
      </section>
    </main>
    <div id="toast" class="toast" hidden data-i18n="saved">已儲存</div>
    <script src="options.js"></script>
  </body>
</html>
